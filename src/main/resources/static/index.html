<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogiTrack — Iniciar Sesión</title>
  <meta name="description" content="Sistema de gestión y auditoría de bodegas LogiTrack S.A." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
</head>
<body class="login-page">

  <!-- Fondo animado -->
  <div class="login-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Card de login -->
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">📦</div>
      <div class="login-logo-text">Logi<span>Track</span></div>
    </div>
    <p class="login-subtitle">Sistema de Gestión de Bodegas · S.A.</p>

    <div id="loginError" class="login-error">
      ⚠️ <span id="loginErrorMsg">Credenciales inválidas</span>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email" name="email" type="email"
          class="form-input" placeholder="admin@logitrack.com"
          value="admin@logitrack.com" required autocomplete="username"
        />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password" name="password" type="password"
          class="form-input" placeholder="••••••••"
          value="admin123" required autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span id="loginBtnText">Iniciar sesión</span>
        <span id="loginSpinner" class="spinner" style="display:none"></span>
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)">
      👤 <strong style="color:var(--text-secondary)">Demo:</strong>
      admin@logitrack.com / admin123
    </p>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = 'http://localhost:8081';

    // Si ya hay sesión, redirigir
    if (localStorage.getItem('lt_token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn    = document.getElementById('loginBtn');
      const text   = document.getElementById('loginBtnText');
      const spin   = document.getElementById('loginSpinner');
      const errBox = document.getElementById('loginError');
      const errMsg = document.getElementById('loginErrorMsg');

      btn.disabled = true;
      text.textContent = 'Verificando...';
      spin.style.display = 'inline-block';
      errBox.classList.remove('show');

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.message || 'Credenciales inválidas');
        }

        localStorage.setItem('lt_token', data.token);
        localStorage.setItem('lt_user',  JSON.stringify({
          id: data.id, nombre: data.nombre, email: data.email, rol: data.rol
        }));

        text.textContent = '✓ Accediendo...';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);

      } catch (err) {
        errMsg.textContent = err.message;
        errBox.classList.add('show');
        btn.disabled = false;
        text.textContent = 'Iniciar sesión';
        spin.style.display = 'none';
      }
    });
  </script>
</body>
</html>
