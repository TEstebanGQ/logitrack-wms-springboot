# ==========================================
# LogiTrack S.A. - Configuración Principal
# ==========================================

spring.application.name=LogiTrack

# ---- Base de datos PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/logitrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Inicialización SQL ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
jwt.secret=LoGiTraCkS3cr3tK3yP4r4JWT2024SuperSegura!xYz987
jwt.expiration=86400000

# ---- Google OAuth2 ----
google.client.id=${GOOGLE_CLIENT_ID:1056581979401-4n88v213h468n4613n89.apps.googleusercontent.com}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- JPA adicional ----
spring.jpa.open-in-view=false

# ---- Logging ----
logging.level.com.proyecto.proyectoSpringBoot=DEBUG
logging.level.org.springframework.security=INFO

# ---- Puerto servidor ----
server.port=${PORT:8081}
server.servlet.context-path=/

# ---- Deshabilitar Caché de Recursos Estáticos ----
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.chain.cache=false