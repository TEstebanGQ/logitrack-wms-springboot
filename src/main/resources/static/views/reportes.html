<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack S.A. - Reportes y Estadísticas</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components/cards.css">
</head>
<body>

    <!-- ===== VISTA: REPORTES ===== -->
    <section id="view-reportes" class="view-section">
        <div class="section-title" style="margin-bottom:18px;">
            <h2>Reportes y estadísticas</h2>
        </div>
        <div id="reportes-list-container"></div>

        <!-- Exportación -->
        <div class="export-section" style="margin-top:28px;">
            <h3 class="export-section__title">Exportar Reportes</h3>
            <div class="export-buttons">
                <button id="btn-export-excel-resumen" class="btn btn-export btn-export--excel" onclick="ExportService.exportarResumenExcel()">
                    <span class="btn-export__icon">📊</span>
                    <div>
                        <div class="btn-export__label">Resumen General</div>
                        <div class="btn-export__format">Excel .xlsx</div>
                    </div>
                </button>
                <button id="btn-export-pdf-resumen" class="btn btn-export btn-export--pdf" onclick="ExportService.exportarResumenPdf()">
                    <span class="btn-export__icon">📄</span>
                    <div>
                        <div class="btn-export__label">Resumen General</div>
                        <div class="btn-export__format">PDF</div>
                    </div>
                </button>
                <button id="btn-export-excel-mov" class="btn btn-export btn-export--excel" onclick="ExportService.exportarMovimientosExcel()">
                    <span class="btn-export__icon">📊</span>
                    <div>
                        <div class="btn-export__label">Movimientos (30 días)</div>
                        <div class="btn-export__format">Excel .xlsx</div>
                    </div>
                </button>
                <button id="btn-export-pdf-mov" class="btn btn-export btn-export--pdf" onclick="ExportService.exportarMovimientosPdf()">
                    <span class="btn-export__icon">📄</span>
                    <div>
                        <div class="btn-export__label">Movimientos (30 días)</div>
                        <div class="btn-export__format">PDF</div>
                    </div>
                </button>
            </div>
        </div>
    </section>

</body>
</html>
