<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack S.A. - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components/tables.css">
</head>
<body>

    <!-- ===== VISTA: PRODUCTOS ===== -->
    <section id="view-productos" class="view-section">
        <div class="section-title" style="margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2>Catálogo de Productos</h2>
                <p style="margin:0; font-size:13px; color:var(--text-muted);">Administración del catálogo, precios, stock y familias de productos.</p>
            </div>
            <div style="display:flex; gap:8px;">
                <button id="btn-nueva-categoria" class="btn btn-secondary btn-sm btn-admin-only" onclick="ProductoModuleController.openCrearCategoriaModal()">+ Nueva Categoría</button>
                <button id="btn-nuevo-producto" class="btn btn-primary btn-sm btn-admin-only" onclick="App.openProductoModal()">+ Nuevo Producto</button>
            </div>
        </div>
        <div id="productos-list-container"></div>
    </section>


</body>
</html>
