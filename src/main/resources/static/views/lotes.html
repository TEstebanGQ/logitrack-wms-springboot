<section id="view-lotes" class="view-section">
<div class="view-header">
  <div class="view-title">
    <h2>Lotes y Vencimientos (FIFO / FEFO)</h2>
    <p>Trazabilidad por número de lote, fechas de fabricación, expiración y alertas de rotación de inventario.</p>
  </div>
  <div class="view-actions">
    <button class="btn btn-secondary" id="btn-exportar-lotes-excel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Exportar Excel
    </button>
    <button class="btn btn-secondary" id="btn-exportar-lotes-pdf">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      Exportar PDF
    </button>
    <button class="btn btn-primary" id="btn-nuevo-lote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Registrar Lote
    </button>
  </div>
</div>

<div class="filters-bar">
  <div class="filter-group">
    <label>Buscar Lote:</label>
    <input type="text" id="buscador-lote-texto" class="form-control" placeholder="Buscar por código de lote o producto...">
  </div>
  <div class="filter-group">
    <label>Filtrar por Bodega:</label>
    <select id="filtro-lote-bodega" class="form-control">
      <option value="">Todas las bodegas</option>
    </select>
  </div>
  <div class="filter-group" style="display: flex; gap: 8px;">
    <button class="btn btn-outline" id="btn-ver-proximos-vencer">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px; vertical-align: middle;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      Próximos a Vencer (30 días)
    </button>
    <button class="btn btn-secondary" id="btn-ver-todos-lotes" style="font-size: 12px; padding: 7px 12px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px; vertical-align: middle;"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      Ver Todos
    </button>
  </div>
</div>



<div class="table-container card">
  <table class="data-table">
    <thead>
      <tr>
        <th>Código Lote</th>
        <th>Producto</th>
        <th>Bodega</th>
        <th>Stock Actual</th>
        <th>Fecha Fab.</th>
        <th>Fecha Venc.</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-lotes-body">
      <tr>
        <td colspan="8" class="text-center py-4">Cargando lotes...</td>
      </tr>
    </tbody>
  </table>
</div>
</section>
