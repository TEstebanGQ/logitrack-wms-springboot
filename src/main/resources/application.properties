# ==========================================
# LogiTrack S.A. - Configuración Principal
# ==========================================

spring.application.name=LogiTrack

# ---- Base de datos PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/logitrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# Permite ddl-auto configurable por entorno (update en desarrollo/Docker, validate en producción estricta)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- Inicialización SQL ----
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
# [H-002 FIX] El secreto JWT se lee OBLIGATORIAMENTE de la variable de entorno JWT_SECRET.
# NO hay valor por defecto hardcodeado. Si JWT_SECRET no está configurado, la aplicación
# fallará al arrancar con un error claro para evitar despliegues inseguros.
# Generar con: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Google OAuth2 ----
# Client ID de Google. Si se especifica GOOGLE_CLIENT_ID en el entorno se usará ese valor;
# de lo contrario, se usa el Client ID de desarrollo para renderizar el botón de Google Sign-In.
google.client.id=${GOOGLE_CLIENT_ID:1056581979401-4n88v213h468n4613n89.apps.googleusercontent.com}

# ---- Servicio de Correo Electrónico (Gmail SMTP) ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración personalizada de la app
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@logitrack.com}
app.mail.company-name=LogiTrack S.A.


# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- JPA adicional ----
spring.jpa.open-in-view=false

# ---- Zona Horaria (Colombia UTC-5) ----
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota


# ---- CORS ----
# [H-004 FIX] Dominios permitidos para CORS. En producción, reemplazar con los dominios reales
# del frontend separados por coma a través de la variable de entorno CORS_ALLOWED_ORIGINS.
# Ejemplo: CORS_ALLOWED_ORIGINS=https://app.logitrack.com,https://admin.logitrack.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8080}

# ---- Logging ----
logging.level.com.proyecto.proyectoSpringBoot=DEBUG
logging.level.org.springframework.security=INFO

# ---- Puerto servidor ----
server.port=${PORT:8081}
server.servlet.context-path=/

# ---- Deshabilitar Caché de Recursos Estáticos ----
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.chain.cache=false