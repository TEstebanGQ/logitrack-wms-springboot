# ==========================================
# LogiTrack S.A. - Configuración Principal
# ==========================================

spring.application.name=LogiTrack

# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=campus2023
spring.datasource.password=campus2023
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Inicialización SQL ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
jwt.secret=LoGiTraCkS3cr3tK3yP4r4JWT2024SuperSegura!xYz987
jwt.expiration=86400000

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---- JPA adicional ----
spring.jpa.open-in-view=false

# ---- Logging ----
logging.level.com.proyecto.proyectoSpringBoot=DEBUG
logging.level.org.springframework.security=INFO

# ---- Puerto servidor ----
server.port=8081
server.servlet.context-path=/