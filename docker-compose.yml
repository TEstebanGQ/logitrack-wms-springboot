services:
  # -------------------------------------------------------------
  # Base de Datos PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: logitrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: logitrack_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logitrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logitrack_network

  # -------------------------------------------------------------
  # Aplicación Backend Spring Boot + Frontend Web
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logitrack_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logitrack_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # [H-002 FIX] JWT_SECRET es OBLIGATORIO. Generar con: openssl rand -base64 64
      # Nunca usar un valor por defecto en producción.
      JWT_SECRET: ${JWT_SECRET:-LogiTrackSecretKeyWMS2026MasterEnterpriseSuperSecureJWT256BitsKey!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-134514735180-itup9unjaso8pr7lk8vvq9hk0bl81avm.apps.googleusercontent.com}
      PORT: 8081
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-true}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@logitrack.com}
    ports:
      - "8081:8081"
    networks:
      - logitrack_network

volumes:
  postgres_data:
    name: logitrack_postgres_data

networks:
  logitrack_network:
    name: logitrack_network
    driver: bridge
